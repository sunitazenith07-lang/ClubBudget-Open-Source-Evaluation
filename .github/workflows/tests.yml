name: RewardBook pull-request tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Visible contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests and save report
        id: pytest
        continue-on-error: true
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Publish test counts
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          f=Path('pytest-report.xml')
          if not f.exists(): s='## Test report\n\nNo report produced; inspect setup logs.\n'
          else:
              r=ET.parse(f).getroot(); suites=[r] if r.tag=='testsuite' else list(r.iter('testsuite'))
              total=sum(int(x.attrib.get('tests',0)) for x in suites); fail=sum(int(x.attrib.get('failures',0)) for x in suites); err=sum(int(x.attrib.get('errors',0)) for x in suites); skip=sum(int(x.attrib.get('skipped',0)) for x in suites)
              s=f'## Test report\n\n- Total: {total}\n- Passed: {total-fail-err-skip}\n- Failed: {fail}\n- Errors: {err}\n- Skipped: {skip}\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as o:o.write(s)
          print(s)
          PY
      - name: Fail if tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1
