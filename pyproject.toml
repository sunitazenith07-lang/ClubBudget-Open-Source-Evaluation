[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clubbudget-evaluation-starter"
version = "1.0.0"
description = "Loyalty rewards, points calculation, refund reversals and repeat-transaction alerts"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::pytest.PytestRemovedIn10Warning",
]
